---
layout: default
---
<article class="page">
  <header class="page-head">
    <p class="eyebrow">{{ page.eyebrow | default: 'Page' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}
      <p class="lede">{{ page.lede }}</p>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
