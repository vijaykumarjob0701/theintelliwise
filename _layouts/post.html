---
layout: default
---
<article class="post">
  <header class="page-head">
    <p class="eyebrow">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">
        {{ page.date | date: '%d %B %Y' }}
      </time>
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.tags.size > 0 %}
      <ul class="tags" aria-label="Topics">
        {% for tag in page.tags %}
          <li>{{ tag }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>

<nav class="post-nav" aria-label="Post">
  <a href="{{ '/' | relative_url }}">← All writing</a>
</nav>
