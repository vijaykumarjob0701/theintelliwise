<header class="site-header">
  <div class="wrap bar">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      {% include brand-mark.html %}
      <span class="wordmark-text">{{ site.title }}</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' or page.url == '/' %} aria-current="page"{% endif %}>
        {% include nav-icon.html name="writing" %}
        <span>Writing</span>
      </a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>
        {% include nav-icon.html name="about" %}
        <span>About</span>
      </a>
    </nav>
  </div>
</header>
