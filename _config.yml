# Custom layouts/CSS only — do not pull minima/primer assets.
theme: null

title: The Intelliwise
tagline: Applied engineering notes
description: >-
  Practical, engineer-to-engineer notes on databases, Postgres, systems,
  and applied ML/AI — by Vijay Kumar in Dublin.
author:
  name: Vijay Kumar
  location: Dublin, Ireland
  role: Full-stack developer · Dublin
  url: https://github.com/vijayliebe
  github: https://github.com/vijayliebe
  linkedin: https://www.linkedin.com/in/vijay-kumar-59b28b4a/
  kaggle: https://www.kaggle.com/vijaykr0701
url: https://vijaykumarjob0701.github.io
baseurl: /theintelliwise
lang: en
timezone: Europe/Dublin
permalink: /posts/:title/

# Same-day posts keep their listed clock times (10:00 / 12:00 / 14:00 UTC)
# without waiting for GitHub Pages to rebuild after that hour.
future: true

# Google Analytics 4. Leave blank to disable the gtag include.
ga_measurement_id: G-57ZMP2XQLQ

logo: /assets/brand/intelliwise-mark.png

twitter:
  card: summary_large_image

social:
  name: Vijay Kumar
  links:
    - https://www.linkedin.com/in/vijay-kumar-59b28b4a/
    - https://github.com/vijayliebe
    - https://www.kaggle.com/vijaykr0701

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

highlighter: rouge
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# GitHub Pages also enables several default plugins (readme-index,
# optional-front-matter, titles-from-headings). Keep repo docs out of the site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - docs
  - .gitignore

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/brand/og-image.png
        width: 1200
        height: 630
        alt: The Intelliwise
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Vijay Kumar
  - scope:
      path: ""
      type: pages
    values:
      layout: page
